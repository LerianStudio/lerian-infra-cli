name: CI

# Two jobs. `go` is the gate: build, vet, gofmt and the test suite, the same four
# checks `make lint test` runs locally, so a green make means a green CI. `release`
# runs semantic-release on a push to main or develop and only after `go` passes — a
# tag cut from a tree that does not compile ships a broken binary.
#
# The release this job creates is what triggers go-release.yml, which builds and
# attaches the binaries.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, edited, synchronize, reopened]

# Read-only by default. The go and templates-compat jobs check out and run
# pull-request code, and a workflow-level write grant hands that code a
# write-capable GITHUB_TOKEN on a same-repository PR. Only release needs writes, and
# it declares them itself.
permissions:
  contents: read

jobs:
  go:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # commitlint lists the pull request's commits through the API, so it needs to
    # read the PR. Nothing here writes.
    permissions:
      contents: read
      pull-requests: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        # This job never pushes, so the checkout must not leave a credential in
        # .git/config for the pull-request code that runs after it.
        persist-credentials: false

    # commitlint reads commitlint.config.cjs from the checkout. The action bundles
    # @commitlint/config-conventional, so there is no package.json and no npm here.
    - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
      with:
        configFile: commitlint.config.cjs

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        # Read from go.mod so the version lives in exactly one place.
        go-version-file: go.mod
        cache: true

    - name: Go Build
      run: go build ./...

    - name: Go Vet
      run: go vet ./...

    # gofmt exits 0 whether or not it found anything; the file list on stdout is
    # the whole result, so it has to be turned into an exit code by hand.
    - name: Go Format Check
      run: |
        set -euo pipefail
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-formatted:" >&2
          echo "$unformatted" >&2
          exit 1
        fi

    - name: Go Test
      run: go test ./... -cover

  # Proves the declared templates ref is one this code understands. Every other test
  # runs against fixtures; this one clones lerian-terraform-foundation at TemplatesRef
  # and reads the real outputs.tf. A bump of the constant to a tag the code cannot
  # drive fails here, not on an operator's first run.
  #
  # It also enforces release order: the tag has to exist in the templates repository
  # before a CLI that declares it can go green. The templates repository is public, so
  # the checkout needs no token.
  templates-compat:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Read the declared templates ref
      id: ref
      run: |
        ref=$(sed -n 's/^const TemplatesRef = "\(.*\)"$/\1/p' pkg/infra/templates.go)
        test -n "$ref" || { echo "TemplatesRef not found in pkg/infra/templates.go" >&2; exit 1; }
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "templates ref: $ref"

    - name: Check out the templates at that ref
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: LerianStudio/lerian-terraform-foundation
        ref: ${{ steps.ref.outputs.ref }}
        path: templates
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
        cache: true

    - name: Compatibility tests
      env:
        LERIAN_TEMPLATES_CHECKOUT: ${{ github.workspace }}/templates
      run: go test ./pkg/infra/ -run 'Templates|MidazRoots|MappedProduct' -v

  release:
    needs: [go, templates-compat]
    # semantic-release creates the tag and the GitHub release, comments on the PRs
    # it closes, and pushes the backmerge.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event_name == 'push'
    steps:
    - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
      id: app-token
      with:
        app-id: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_APP_ID }}
        private-key: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_PRIVATE_KEY }}

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}

    - name: Import GPG key
      uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
      id: import_gpg
      with:
        gpg_private_key: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY }}
        passphrase: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY_PASSWORD }}
        git_committer_name: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
        git_committer_email: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
        git_config_global: true
        git_user_signingkey: true
        git_commit_gpgsign: true

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'

    - name: Semantic Release
      uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4.2.2
      id: semantic
      with:
        ci: false
        semantic_version: 23.0.8
        extra_plugins: |
          conventional-changelog-conventionalcommits@v7.0.2
          @saithodev/semantic-release-backmerge
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        GIT_AUTHOR_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
        GIT_AUTHOR_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
        GIT_COMMITTER_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
        GIT_COMMITTER_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
