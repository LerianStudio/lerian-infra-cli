name: Go Release

# The one workflow this repository still owns, because the shared repository has
# nothing that covers it: publishing binaries. It also carries the TemplatesRef
# check, which is now the ONLY place that check runs — the pull-request job that
# used to do it was removed, because TemplatesRef names a tag the templates
# repository has not published yet and every PR carried a permanently red check.
# Here it is not noise: it is the gate that stops a release shipping a binary whose
# declared templates ref does not exist. It moves to a shared workflow once that
# tag is out. LerianStudio/github-actions-shared-workflows
# has no goreleaser step and no release-asset upload anywhere in it — its own
# go-release.yml is a container-image and GitOps umbrella. Everything else here
# (analysis, PR validation, security scan, semantic-release) is the shared workflow.
#
# Replace this with a `uses:` the moment that repository publishes a goreleaser
# workflow.
#
# It reacts to the release that release.yml publishes, which is why .goreleaser.yml
# runs in `mode: append` with its changelog disabled.

on:
  release:
    types: [published]

# goreleaser uploads the archives onto the release that triggered this run.
permissions:
  contents: write

jobs:
  release:
    name: Build and attach binaries
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the version from the tag, so it needs the tags.
          fetch-depth: 0
          persist-credentials: false

      # The declared templates ref must exist and still match this code. The pull
      # request gates it too, but a release can be published by hand, and that path
      # would otherwise ship a binary whose TemplatesRef points at nothing.
      - name: Read the declared templates ref
        id: ref
        run: |
          ref=$(sed -n 's/^const TemplatesRef = "\(.*\)"$/\1/p' pkg/infra/templates.go)
          test -n "$ref" || { echo "TemplatesRef not found" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the templates at that ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LerianStudio/lerian-terraform-foundation
          ref: ${{ steps.ref.outputs.ref }}
          path: templates
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod so the version lives in exactly one place.
          go-version-file: go.mod
          cache: true

      # The release must not ship a binary the suite has not passed.
      - name: Test
        env:
          LERIAN_TEMPLATES_CHECKOUT: ${{ github.workspace }}/templates
        run: go test ./... -cover

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # An exact version, not a range: '~> v2' resolves to whatever GoReleaser
          # released most recently, so the tool that builds a release could change
          # between two runs of the same tag.
          version: 'v2.18.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
