name: Go Release

# Attaches the lerian-infra binaries to a release that already exists.
#
# The release itself is created by the `release` job in ci.yml, which runs
# semantic-release on a push to main or develop. That job publishes the tag and the
# release notes; this one reacts to the publication and uploads the artifacts, which
# is why .goreleaser.yml runs in `mode: append` with its changelog disabled.
#
# WHY GORELEASER IS CALLED DIRECTLY AND NOT THROUGH THE SHARED WORKFLOW
#
# LerianStudio/github-actions-shared-workflows/.github/workflows/go-release.yml was a
# goreleaser workflow at v1.3.5 — which is what lerian-cli still pins — and has since
# been repurposed. At v1.62.0, the current release, the same filename is a
# container-image and GitOps
# umbrella (changes -> release -> build -> gitops-update) with no goreleaser step in
# it at all, and no other workflow in that repository provides one. Pinning v1.3.5
# would tie this release to a contract its owners have moved off, roughly fifty
# releases back, including the pinned action versions inside it.
#
# Switching to the shared workflow later is a small change: replace the job below
# with `uses:` plus the goreleaser_* inputs. It is worth doing the moment that
# repository publishes a current goreleaser workflow.

on:
  release:
    types: [published]

# goreleaser uploads the archives onto the release that triggered this run.
permissions:
  contents: write

jobs:
  release:
    name: Build and attach binaries
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the version from the tag, so it needs the tags.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod so the version lives in exactly one place. Hardcoding it
          # here is how a release ends up built by a different toolchain than the one
          # CI tested with.
          go-version-file: go.mod
          cache: true

      # The release must not ship a binary the test suite has not passed. ci.yml
      # gates the tag, but a release can also be published by hand.
      # The declared templates ref must exist and still match this code. ci.yml
      # gates the tag, but a release can also be published by hand, and that path
      # would otherwise ship a binary whose TemplatesRef points at nothing.
      - name: Read the declared templates ref
        id: ref
        run: |
          ref=$(sed -n 's/^const TemplatesRef = "\(.*\)"$/\1/p' pkg/infra/templates.go)
          test -n "$ref" || { echo "TemplatesRef not found" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the templates at that ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LerianStudio/lerian-terraform-foundation
          ref: ${{ steps.ref.outputs.ref }}
          path: templates
          persist-credentials: false

      - name: Test
        env:
          LERIAN_TEMPLATES_CHECKOUT: ${{ github.workspace }}/templates
        run: go test ./... -cover

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # An exact version, not a range: '~> v2' resolves to whatever GoReleaser
          # released most recently, so the tool that builds a release could change
          # between two runs of the same tag.
          version: 'v2.18.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
