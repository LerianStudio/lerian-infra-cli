name: PR Validation

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/pr-validation.yml@v1.62.0
    with:
      runner_type: "blacksmith-4vcpu-ubuntu-2404"
      pr_title_types: |
        feat
        fix
        docs
        style
        refactor
        perf
        test
        chore
        ci
        build
        revert
      # The scope allowlist this repository's commitlint config already enforces.
      pr_title_scopes: |
        release
      require_scope: false
      enable_auto_labeler: false
    secrets: inherit
